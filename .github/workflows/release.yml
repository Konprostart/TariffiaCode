name: Release

on:
  push:
    branches: [main]
    paths:
      - '.release-version'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must be dispatched from main" >&2
              exit 1
            fi
            TAG="$RELEASE_TAG_INPUT"
            if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$TAG^{commit}" origin/main || {
              echo "Manual release tag must point to a commit on main" >&2
              exit 1
            }
          else
            TAG="$(tr -d '[:space:]' < .release-version)"
            if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
            build/native-source-work/ndk/*.zip
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/native_sources.lock.json', 'runtime_tools/ndk-patches/**', 'runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/build_android_runtime_from_source.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Verify and build APKs
        env:
          AND_CODE_STORE_FILE: ${{ runner.temp }}/release.keystore
          AND_CODE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AND_CODE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AND_CODE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Not itself secret (an OAuth App client ID is meant to be public - it's the value sent
          # in the browser's authorize URL), but named with the AND_CODE_ prefix because GitHub
          # Actions rejects any repo variable/secret starting with GITHUB_. Without this, the app's
          # BuildConfig.GITHUB_CLIENT_ID (app/build.gradle.kts) is baked in empty and every APK this
          # workflow publishes shows "GitHubクライアントIDが含まれていない" with no way to sign in.
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ]; then
            echo "AND_CODE_GITHUB_CLIENT_ID repo variable is not set - the published APK would have no GitHub sign-in" >&2
            exit 1
          fi
          ./gradlew detekt spotlessCheck :app:lintGithubDebug :app:testGithubDebugUnitTest assembleGithubDebug assembleGithubRelease
          # Separate invocation, deliberately without GITHUB_CLIENT_ID: this is the same flavor and
          # signing config F-Droid's own build server produces (gradleprops: andcode.fdroidBuild=true,
          # no client ID), so this asset is what fdroiddata's Binaries:/AllowedAPKSigningKeys: verify
          # a reproducible build against - it must be built exactly the way F-Droid builds it.
          # GITHUB_CLIENT_ID is set at step level above, so it must be unset here explicitly:
          # otherwise it is baked into BuildConfig and classes.dex no longer matches F-Droid's.
          env -u GITHUB_CLIENT_ID ./gradlew -Pandcode.fdroidBuild=true :app:assembleFdroidRelease

      - name: Verify signed production APK and create updater metadata
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/github/release/app-github-release.apk"
          test -f "$APK" || { echo "Signed production APK missing: $APK" >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "android build-tools : ${BUILD_TOOLS:-<unset>}"
          echo "apksigner binary    : ${BUILD_TOOLS}/apksigner (executable: $([ -x "${BUILD_TOOLS}/apksigner" ] && echo yes || echo no))"
          echo "APK file            : $(ls -la "$APK" 2>&1)"
          echo "APK META-INF entries:"
          unzip -l "$APK" | grep -i 'META-INF/' | head -10 || true
          EXPECTED="$("$JAVA_HOME/bin/keytool" -list -v -keystore "$RELEASE_KEYSTORE_FILE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z' | head -1)"
          echo "keytool certificate SHA-256 : ${EXPECTED:-<empty>}"
          # Capture to a file instead of piping, so the verifier's own message survives in the log
          # whatever it prints. The v1.2.35 run failed with an empty digest and no stderr at all, and
          # a pipe into sed would have swallowed the reason either way.
          APKSIGNER_OUT="$RUNNER_TEMP/apksigner-verify.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$APKSIGNER_OUT" 2>&1 || true
          echo "----- apksigner verify --verbose --print-certs (stdout + stderr) -----"
          cat "$APKSIGNER_OUT"
          echo "----- end apksigner output -----"
          # apksigner labels the digest by signature scheme ("Signer #1 certificate SHA-256 digest:"
          # for v1/v2, "V3.0 Signer: certificate SHA-256 digest:" for an APK signed with v3), so match
          # on the label only. GitHub's build-tools 37.0.0 reports the v3 form, which the old
          # "Signer #1" pattern missed and turned a correctly signed APK into a failed release.
          ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$APKSIGNER_OUT" | tr -d ':\r' | tr 'A-Z' 'a-z' | head -1)"
          echo "apksigner APK SHA-256       : ${ACTUAL:-<empty>}"
          if [ -z "$EXPECTED" ]; then
            echo "::error title=Release keystore unreadable::keytool returned no certificate for the configured alias, so the APK cannot be checked against it. Verify RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS; the alias is case-sensitive and must exist in the keystore." >&2
            exit 1
          fi
          if [ -z "$ACTUAL" ]; then
            echo "::error title=APK signer missing::apksigner reported no signer certificate on $APK, so the production APK is not signed with the release signing config." >&2
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error title=Signer mismatch::The production APK is signed with a different key than the release keystore. keystore=$EXPECTED apk=$ACTUAL. Do not rotate the key: existing installs could no longer update." >&2
            exit 1
          fi
          echo "Signer verified: $ACTUAL"
          TAG="${{ steps.tag.outputs.tag }}"
          python scripts/create_app_update_manifest.py \
            --apk "$APK" \
            --channel release \
            --commit-sha "$(git rev-parse HEAD)" \
            --asset-name "tariffiacode-$TAG-release.apk" \
            --output "$RUNNER_TEMP/tariffiacode-update-manifest.json" \
            --expected-signer-sha256 "$EXPECTED"
          python3 - "$RUNNER_TEMP/tariffiacode-update-manifest.json" "${{ steps.tag.outputs.tag }}" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_version = sys.argv[2].removeprefix("v")
          if manifest["versionName"] != expected_version:
              raise SystemExit(f"Release tag {sys.argv[2]} does not match APK version {manifest['versionName']}")
          PY

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          RELEASE_APK="app/build/outputs/apk/github/release/app-github-release.apk"
          test -f "$RELEASE_APK" || { echo "Refusing to publish without a signed release APK" >&2; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "$TAG" \
              --generate-notes
          fi
          cp "$RELEASE_APK" "tariffiacode-$TAG-release.apk"
          cp "$RUNNER_TEMP/tariffiacode-update-manifest.json" "tariffiacode-$TAG-update.json"
          ASSETS=("tariffiacode-$TAG-release.apk" "tariffiacode-$TAG-update.json")
          # Never leave an unsigned or non-updater debug APK looking like an installable release asset.
          gh release delete-asset "$TAG" "tariffiacode-$TAG-release-unsigned.apk" -y || true
          gh release delete-asset "$TAG" "and-code-$TAG-release-unsigned.apk" -y || true
          gh release delete-asset "$TAG" "tariffiacode-$TAG-debug.apk" -y || true
          # F-Droid's own build server produces this same flavor/signing combination from source
          # (see the "Verify and build APKs" step above); publishing it lets fdroiddata's
          # Binaries:/AllowedAPKSigningKeys: metadata verify a reproducible build against it.
          if [ -f app/build/outputs/apk/fdroid/release/app-fdroid-release.apk ]; then
             cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "tariffiacode-$TAG-fdroid-release.apk"
             ASSETS+=("tariffiacode-$TAG-fdroid-release.apk")
          fi
          gh release upload "$TAG" --clobber "${ASSETS[@]}"
