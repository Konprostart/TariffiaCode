name: Debug Release

# Dedicated debug update channel. A successful production Release run refreshes the rolling
# `debug-latest` prerelease using the same source commit and a stable debug signing key.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  debug-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tariffiacode-debug-update-channel
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require main for manual debug publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Debug updates may only be published from main" >&2
            exit 1
          fi

      - name: Resolve source commit from the published release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/Konprostart/TariffiaCode/releases?per_page=100 --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')"
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the stable release tag from GitHub: $TAG" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-metadata"
          gh release download "$TAG" \
            --pattern "tariffiacode-$TAG-update.json" \
            --dir "$RUNNER_TEMP/release-metadata"
          COMMIT_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commitSha"])' \
            "$RUNNER_TEMP/release-metadata/tariffiacode-$TAG-update.json")"
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Release metadata contains an invalid source commit: $COMMIT_SHA" >&2
            exit 1
          fi
          git checkout --detach "$COMMIT_SHA"
          if [ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]; then
            echo "Could not check out the release source commit" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
            build/native-source-work/ndk/*.zip
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/native_sources.lock.json', 'runtime_tools/ndk-patches/**', 'runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/build_android_runtime_from_source.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Decode stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"

      - name: Build signed debug APK
        env:
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleGithubDebug
          APK="app/build/outputs/apk/github/debug/app-github-debug.apk"
          test -f "$APK" || { echo "debug APK not produced at $APK" >&2; exit 1; }
          # Verify the packaged applicationId is the debug one.
          PKG="$("$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1 || true)"
          if [ "$PKG" != "com.konprostart.tariffiacode.debug" ]; then
            echo "Unexpected debug package id: '$PKG'" >&2
            exit 1
          fi
          echo "debug package id verified: $PKG"

      - name: Verify debug APK signing identity
        env:
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/github/debug/app-github-debug.apk"
          # Expected signer cert SHA-256 taken from the configured stable debug keystore.
          EXPECTED="$("$JAVA_HOME"/bin/keytool -list -v -keystore "$DEBUG_KEYSTORE_FILE" \
            -storepass "$DEBUG_KEYSTORE_PASSWORD" -alias "$DEBUG_KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z' | head -1)"
          ACTUAL="$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "expected debug signer: $EXPECTED"
          echo "actual   debug signer: $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Debug APK is not signed with the configured stable debug key" >&2
            exit 1
          fi

      - name: Create debug updater metadata
        run: |
          python scripts/create_app_update_manifest.py \
            --apk app/build/outputs/apk/github/debug/app-github-debug.apk \
            --channel debug \
            --commit-sha "$(git rev-parse HEAD)" \
            --asset-name tariffiacode-debug.apk \
            --output "$RUNNER_TEMP/tariffiacode-debug-update.json"

      - name: Publish rolling debug-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/github/debug/app-github-debug.apk"
          cp "$APK" "tariffiacode-debug.apk"
          cp "$RUNNER_TEMP/tariffiacode-debug-update.json" tariffiacode-debug-update.json
          VERSION="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/tariffiacode-debug-update.json"))["versionName"])')"
          VERSION_CODE="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/tariffiacode-debug-update.json"))["versionCode"])')"
          COMMIT_SHA="$(git rev-parse HEAD)"
          if gh release view debug-latest >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/previous-debug"
            if ! gh release download debug-latest --pattern tariffiacode-debug-update.json --dir "$RUNNER_TEMP/previous-debug" >/dev/null 2>&1; then
              echo "Existing debug-latest lacks verified metadata; refusing to overwrite it blindly" >&2
              exit 1
            fi
            python3 - "$RUNNER_TEMP/previous-debug/tariffiacode-debug-update.json" "$RUNNER_TEMP/tariffiacode-debug-update.json" <<'PY'
          import json
          import sys
          old = json.load(open(sys.argv[1], encoding="utf-8"))
          new = json.load(open(sys.argv[2], encoding="utf-8"))
          old_code = int(old["versionCode"])
          new_code = int(new["versionCode"])
          if new_code < old_code or (new_code == old_code and new["commitSha"] != old["commitSha"]):
              raise SystemExit(f"Refusing to replace debug-latest {old_code}/{old['commitSha']} with {new_code}/{new['commitSha']}")
          PY
          fi
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest \
              --target "$COMMIT_SHA" \
              --title "$VERSION" \
              --notes "Rolling debug update channel. Version code: $VERSION_CODE. Commit: $COMMIT_SHA. Assets include signed APK and verified metadata." \
              --prerelease
          else
            gh release edit debug-latest --title "$VERSION" \
              --notes "Rolling debug update channel. Version code: $VERSION_CODE. Commit: $COMMIT_SHA. Assets include signed APK and verified metadata." \
              --prerelease
          fi
          gh release upload debug-latest --clobber tariffiacode-debug.apk tariffiacode-debug-update.json
