name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes to a pull request cancel their in-flight run; pushes to main always
# finish so the branch keeps a complete history of results.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + spotless)
        run: ./gradlew detekt spotlessCheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
            build/native-source-work/ndk/*.zip
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/native_sources.lock.json', 'runtime_tools/ndk-patches/**', 'runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/build_android_runtime_from_source.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Lint
        run: ./gradlew :app:lintGithubDebug

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
            build/native-source-work/ndk/*.zip
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/native_sources.lock.json', 'runtime_tools/ndk-patches/**', 'runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/build_android_runtime_from_source.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Validate runtime build scripts
        run: |
          python -m py_compile \
            runtime_tools/termux_assets.py \
            scripts/build_android_runtime_from_source.py \
            scripts/prepare_android_runtime_assets.py \
            scripts/prepare_android_runtime_native_libs.py \
            scripts/test_android_runtime_source_build.py
          python scripts/build_android_runtime_from_source.py --self-test
          python scripts/prepare_android_runtime_assets.py --help >/dev/null
          python -m unittest scripts.test_android_runtime_source_build
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('runtime_tools/native_sources.lock.json').read_text())
          assert lock['version'] == 1
          assert {'arm64-v8a', 'x86_64'} == set(lock['abis'])
          assert lock['ndk']['sha256'] and lock['ndk']['version']
          assert all(item['sha256'] for item in lock['sources'].values())
          legacy = json.loads(Path('runtime_tools/termux_assets.lock.json').read_text())
          assert legacy['version'] == 1
          assert {'arm64-v8a', 'x86_64'} == set(legacy['architectures'])
          PY

      - name: Test and build debug APK
        # See release.yml for why this is AND_CODE_-prefixed rather than GITHUB_CLIENT_ID directly
        # (GitHub Actions rejects that prefix for repo variables/secrets); without it this job's
        # own debug APK artifact would have no GitHub sign-in either.
        #
        # Instrumentation is compiled here. Device execution is a separate validation concern and
        # must not be implied by this compile-only job.
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      # The build above produced the embedded runtime from pinned sources with the pinned NDK.
      # Re-check the ABI/SONAME/loader contract on the generated prefixes (both ABIs, incl. the
      # 32-bit loaders) so a source-build regression fails the build even if Gradle cached outputs.
      - name: Verify native runtime ABI/SONAME contract
        run: |
          python scripts/build_android_runtime_from_source.py \
            --verify-only \
            --output-dir build/generated/runtime-assets \
            --report build/native-source-report.json
          cat build/native-source-report.json

      # assembleRelease runs R8 with minification and resource shrinking, which is the single
      # most expensive task in this workflow. The published artifact is built by release.yml,
      # so pull requests only need it to prove the release build still compiles — which main
      # covers on every merge.
      - name: Build release APK
        if: github.event_name == 'push'
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleGithubRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tariffiacode-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tariffiacode-release-unsigned
          path: app/build/outputs/apk/github/release/app-github-release-unsigned.apk
          if-no-files-found: error

  ssh-android-runtime:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 60
    env:
      GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
            build/native-source-work/ndk/*.zip
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/native_sources.lock.json', 'runtime_tools/ndk-patches/**', 'runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/build_android_runtime_from_source.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Prepare ephemeral SSH and OpenCode endpoints
        id: prepare-fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi

          fixture_dir="$RUNNER_TEMP/tariffia-ssh-fixture"
          mkdir -p "$fixture_dir"
          test_user="ssh-test-${GITHUB_RUN_ID}"
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          echo "SSH_TEST_USERNAME=$test_user" >> "$GITHUB_ENV"
          echo "SSH_TEST_PASSWORD=$test_password" >> "$GITHUB_ENV"

          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/host_key"
          sudo useradd --create-home --shell /bin/bash "$test_user"
          printf '%s:%s\n' "$test_user" "$test_password" | sudo chpasswd
          sudo mkdir -p /run/sshd
          cat > "$fixture_dir/sshd_config" <<EOF
          Port 2222
          ListenAddress 0.0.0.0
          HostKey $fixture_dir/host_key
          PidFile $fixture_dir/sshd.pid
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          UsePAM no
          PermitRootLogin no
          AllowUsers $test_user
          AllowTcpForwarding local
          PermitOpen 127.0.0.1:4096
          LogLevel ERROR
          EOF
          sudo /usr/sbin/sshd -t -f "$fixture_dir/sshd_config"
          sudo /usr/sbin/sshd -D -e -f "$fixture_dir/sshd_config" > "$fixture_dir/sshd.log" 2>&1 &
          echo "$!" > "$fixture_dir/sshd.pid"

          python3 -u - <<'PY' > "$fixture_dir/opencode.log" 2>&1 &
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class HealthHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/global/health":
                      self.send_error(404)
                      return
                  body = b'{"healthy":true,"version":"android-art-test"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Connection", "close")
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 4096), HealthHandler).serve_forever()
          PY
          echo "$!" > "$fixture_dir/opencode.pid"

          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 2222 && nc -z 127.0.0.1 4096; then exit 0; fi
            sleep 1
          done
          echo "Temporary SSH/health fixture did not start" >&2
          exit 1

      - name: Run persisted-password SSH test on Android ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          disable-animations: true
          script: >-
            ./gradlew :app:connectedGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.konprostart.tariffiacode.runtime.vps.VpsSshConnectInstrumentedTest#persistedPasswordAuthenticatesAndForwardsToLoopbackOpenCodeHealth
            -Pandroid.testInstrumentationRunnerArguments.sshTestHost=10.0.2.2
            -Pandroid.testInstrumentationRunnerArguments.sshTestPort=2222
            -Pandroid.testInstrumentationRunnerArguments.sshTestUsername=$SSH_TEST_USERNAME
            -Pandroid.testInstrumentationRunnerArguments.sshTestPassword=$SSH_TEST_PASSWORD

      - name: Upload persisted-password SSH test reports
        if: always() && steps.prepare-fixture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-android-main-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Run SSH handshake diagnostic separately (non-blocking)
        if: always() && steps.prepare-fixture.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          disable-animations: true
          script: >-
            ./gradlew :app:connectedGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.konprostart.tariffiacode.runtime.vps.VpsSshConnectInstrumentedTest#diagnosePasswordHandshakeFailure
            -Pandroid.testInstrumentationRunnerArguments.sshTestHost=10.0.2.2
            -Pandroid.testInstrumentationRunnerArguments.sshTestPort=2222
            -Pandroid.testInstrumentationRunnerArguments.sshTestUsername=$SSH_TEST_USERNAME
            -Pandroid.testInstrumentationRunnerArguments.sshTestPassword=$SSH_TEST_PASSWORD

      - name: Stop ephemeral SSH fixture
        if: always()
        shell: bash
        run: |
          fixture_dir="$RUNNER_TEMP/tariffia-ssh-fixture"
          if [ -f "$fixture_dir/sshd.pid" ]; then sudo kill "$(cat "$fixture_dir/sshd.pid")" || true; fi
          if [ -f "$fixture_dir/opencode.pid" ]; then kill "$(cat "$fixture_dir/opencode.pid")" || true; fi
          if [ -n "${SSH_TEST_USERNAME:-}" ]; then sudo userdel -r "$SSH_TEST_USERNAME" || true; fi

      - name: Upload SSH diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-android-diagnostic-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
